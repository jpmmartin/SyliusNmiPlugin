# The platform's payment row ships complete and refund but no way to void, so this adds the
# route it is missing. It is the platform's own controller: only the transition differs, which
# is what makes `sylius.payment.pre_cancel` fire and lets the gateway be asked first.
jpm_martin_sylius_nmi_admin_order_payment_void:
    path: /orders/{orderId}/payments/{id}/void
    methods: [PUT]
    defaults:
        _controller: sylius.controller.payment::applyStateMachineTransitionAction
        _sylius:
            event: cancel
            permission: true
            repository:
                method: findOneByOrderId
                arguments:
                    id: $id
                    orderId: $orderId
            state_machine:
                graph: sylius_payment
                transition: cancel
            redirect:
                route: sylius_admin_order_show
                parameters:
                    id: $orderId

# What the gateway reported that nobody in this store caused: a batch that failed to settle, a
# chargeback. Read-only — there is no create, no edit and no delete, because a store cannot
# un-happen either of them by deleting a row.
jpm_martin_sylius_nmi_admin_gateway_notice_index:
    path: /nmi-notices
    methods: [GET]
    defaults:
        _controller: jpm_martin_sylius_nmi.controller.nmi_gateway_notice::indexAction
        _sylius:
            section: admin
            permission: true
            template: "@SyliusAdmin/shared/crud/index.html.twig"
            grid: jpm_martin_sylius_nmi_admin_gateway_notice
