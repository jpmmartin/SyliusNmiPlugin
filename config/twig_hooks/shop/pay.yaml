sylius_twig_hooks:
    hooks:
        # The pay page this plugin renders. A store, or a later change, adds to it rather than
        # replacing the template — the 3-D Secure mount point arrives here as a second hookable.
        'jpm_martin_sylius_nmi.shop.pay':
            # Above the card form: a returning shopper should meet the card they already saved
            # before the fields for typing a new one.
            stored_cards:
                template: '@JpmMartinSyliusNmiPlugin/shop/pay/nmi/stored_cards.html.twig'
                priority: 10
            card_form:
                template: '@JpmMartinSyliusNmiPlugin/shop/pay/nmi/card_form.html.twig'
                priority: 0
            save_card:
                template: '@JpmMartinSyliusNmiPlugin/shop/pay/nmi/save_card.html.twig'
                priority: -5
            # Below the option to keep the card, above the authentication target.
            pay_button:
                template: '@JpmMartinSyliusNmiPlugin/shop/pay/nmi/pay_button.html.twig'
                priority: -8
            three_d_secure:
                template: '@JpmMartinSyliusNmiPlugin/shop/pay/nmi/three_d_secure.html.twig'
                priority: -10
