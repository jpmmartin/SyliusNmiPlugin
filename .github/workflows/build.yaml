name: Build

on:
    push:
        branches: [main]
        paths-ignore: ["**.md"]
    pull_request:
        paths-ignore: ["**.md"]
    workflow_dispatch: ~

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        runs-on: ubuntu-latest

        name: "PHP ${{ matrix.php }}, ${{ matrix.refund_plugin && 'with' || 'without' }} the refund plugin"

        strategy:
            fail-fast: false
            matrix:
                php: ["8.2", "8.4"]
                # The two configurations the specification requires. The plugin refunds on its own
                # and must keep working when `sylius/refund-plugin` is absent, so the job that
                # removes it is not a formality — it is the one that proves the dependency really
                # is optional.
                refund_plugin: [true, false]

        env:
            APP_ENV: test
            # Overrides the value committed in tests/TestApplication/.env, which points at a
            # developer's own PostgreSQL. A real environment variable wins over a dotenv file.
            DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/nmi_plugin_test?serverVersion=16&charset=utf8"
            SYLIUS_MESSENGER_TRANSPORT_PAYMENT_REQUEST_DSN: "sync://"

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_PASSWORD: postgres
                ports: ["5432:5432"]
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

        steps:
            - uses: actions/checkout@v5

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "${{ matrix.php }}"
                  extensions: intl, gd, opcache, pdo_pgsql, pgsql
                  tools: composer:v2
                  coverage: none

            # 22.x, because the gateway's browser component and Sylius's own front-end build are
            # what this pins for — not the version of whoever last ran it locally.
            - name: Set up Node
              uses: actions/setup-node@v5
              with:
                  node-version: "22.x"

            - name: Enable Yarn
              run: corepack enable

            - name: Cache Composer
              uses: actions/cache@v5
              with:
                  path: ~/.cache/composer/files
                  key: "${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}"
                  restore-keys: "${{ runner.os }}-php-${{ matrix.php }}-composer-"

            - name: Install dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            # Second job only. Removing it after the install is deliberate: it proves the package
            # can be taken out of a working store, which is the situation a consumer is in.
            - name: Remove the optional refund plugin
              if: "${{ !matrix.refund_plugin }}"
              run: composer remove --dev sylius/refund-plugin --no-interaction --no-progress

            # Strict, and without --no-check-publish: this package is published, so the checks
            # that only matter for publishing are exactly the ones that matter.
            - name: Validate composer.json
              run: composer validate --ansi --strict

            - name: Check for known vulnerabilities
              run: composer audit --abandoned=ignore

            # The gateway credentials are stored encrypted, and the key is not in the repository.
            - name: Generate the payment encryption key
              run: vendor/bin/console sylius:payment:generate-key

            - name: Prepare the database
              run: |
                  vendor/bin/console doctrine:database:create --if-not-exists
                  vendor/bin/console doctrine:migrations:migrate --no-interaction

            # Without this the pay page cannot render: its layout asks Encore for an entry that
            # only exists once the test application has been built.
            - name: Build the front end
              run: composer frontend-clear

            # The theme-token derivation is pure JavaScript with no DOM in it, which is what lets
            # Node test it here without a browser.
            # The style helper and the card form's public contract — its attributes, modes,
            # events and `submit` — on Node's own runner, with jsdom for a page and the gateway's
            # widget package routed to a stand-in, because that package needs a browser to load.
            - name: Test the front end
              run: yarn test

            - name: Run ECS
              run: vendor/bin/ecs check src tests --no-progress-bar

            - name: Lint the container
              run: vendor/bin/console lint:container

            # The leg without the refund plugin analyses with the configuration that leaves out the
            # four files implementing that package's interfaces; nothing else differs.
            - name: Run PHPStan
              run: vendor/bin/phpstan analyse src/ --no-progress --configuration=${{ matrix.refund_plugin && 'phpstan.neon' || 'phpstan-without-refund-plugin.neon' }}

            - name: Run PHPUnit
              run: vendor/bin/phpunit --colors=always

            - name: Run Behat
              run: vendor/bin/behat --colors --strict --no-interaction -f progress --tags "~@javascript"

            - name: Upload Behat logs
              uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: "behat-logs-php${{ matrix.php }}-refund-${{ matrix.refund_plugin }}"
                  path: etc/build/
                  if-no-files-found: ignore

    # The schema on the other engine Sylius supports. The four jobs above build their database with
    # the plugin's migration on PostgreSQL and run the whole suite; this one builds it on MySQL and
    # runs the test that compares the tables the migration built with the ones the mapping
    # describes. One migration serves both engines — Doctrine derives each engine's statements when
    # it runs — and this job, not a second copy of the SQL, is what proves it.
    schema-on-mysql:
        runs-on: ubuntu-latest

        name: "Migrations on MySQL"

        env:
            APP_ENV: test
            # serverVersion decides which DBAL platform handles the connection. The test
            # application's own doctrine.yaml says 5.7; the step below prints which one won.
            DATABASE_URL: "mysql://root:root@127.0.0.1:3306/nmi_plugin_test?serverVersion=8.4&charset=utf8mb4"
            SYLIUS_MESSENGER_TRANSPORT_PAYMENT_REQUEST_DSN: "sync://"

        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: root
                ports: ["3306:3306"]
                options: >-
                    --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 20

        steps:
            - uses: actions/checkout@v5

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: intl, gd, opcache, pdo_mysql
                  tools: composer:v2
                  coverage: none

            - name: Cache Composer
              uses: actions/cache@v5
              with:
                  path: ~/.cache/composer/files
                  key: "${{ runner.os }}-php-8.4-composer-${{ hashFiles('composer.json') }}"
                  restore-keys: "${{ runner.os }}-php-8.4-composer-"

            - name: Install dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            - name: Generate the payment encryption key
              run: vendor/bin/console sylius:payment:generate-key

            - name: Which platform DBAL picked
              run: |
                  vendor/bin/console dbal:run-sql "SELECT VERSION()"
                  php -r 'require "vendor/autoload.php"; $_SERVER["APP_ENV"] = $_ENV["APP_ENV"] = "test"; require "vendor/sylius/test-application/config/bootstrap.php"; $kernel = new Sylius\TestApplication\Kernel("test", false); $kernel->boot(); echo get_class($kernel->getContainer()->get("doctrine.dbal.default_connection")->getDatabasePlatform()), PHP_EOL;'

            # The migration must build the four tables here as it does on PostgreSQL, and nothing of
            # the plugin's may be skipped: skipping is what the old per-engine halves did.
            - name: Build the database with the migration
              run: |
                  set -o pipefail
                  vendor/bin/console doctrine:database:create --if-not-exists
                  vendor/bin/console doctrine:migrations:migrate --no-interaction | tee migrate.log
                  ! grep -i 'JpmMartin' migrate.log | grep -qi skipped

            - name: The tables the migration built are the ones the mapping describes
              run: vendor/bin/phpunit tests/Integration/Migrations --colors=always
