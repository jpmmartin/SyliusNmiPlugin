# Installs this plugin into a store that has never seen it, two ways — by running the commands the
# README publishes, and by letting the Flex recipe in `recipe/` do the file edits — and checks
# that both end in the same working store.
name: Install

on:
    release:
        types: [published]
    pull_request:
        # Only the things that can break an installation. A pull request touching handlers pays
        # nothing for this job.
        paths:
            - 'README.md'
            - 'docs/**'
            - 'recipe/**'
            - 'config/routes/**'
            - 'config/config.yaml'
            - 'assets/**'
            - 'composer.json'
            - 'package.json'
            - 'bin/extract-readme-commands'
            - 'bin/apply-readme-edits'
            - '.github/workflows/install.yaml'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    install:
        name: "A store that has never seen this plugin, installed from the ${{ matrix.path }}"
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                # `readme`: the README's own commands, extracted, and its file edits, mirrored.
                # `recipe`: the Flex recipe in `recipe/`, compiled into an endpoint the store is
                # pointed at, so that `composer require` does the file edits itself — which is what
                # a Sylius Standard store gets once the recipe is in symfony/recipes-contrib. Both
                # paths end in the same checks.
                path: [readme, recipe]

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_PASSWORD: postgres
                ports: ['5432:5432']
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

        env:
            APP_ENV: dev
            DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/store

        steps:
            - name: Check out the plugin
              uses: actions/checkout@v5
              with:
                  path: plugin

            # 8.4, not the 8.2 the plugin itself supports, and the reason is the store rather than
            # the plugin. Sylius Standard 2.2 requires PHP 8.3, so on 8.2 `create-project` quietly
            # falls back to the last skeleton that accepted it, v2.1.4 — and that one no longer
            # installs at all: its `allow-plugins` never named `rector/extension-installer`, which
            # a development dependency of it has since come to require. Found by running this job,
            # not by reading anything. Whether the plugin works on 8.2 is build.yaml's question.
            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, gd, opcache, pdo_pgsql, pgsql
                  tools: composer:v2
                  coverage: none

            - name: Set up Node
              uses: actions/setup-node@v5
              with:
                  node-version: '22.x'

            # Without this there is no `yarn` on the runner, and step 5 of the README — the one
            # that fails most silently for a reader — fails loudly here instead.
            - name: Enable Yarn
              run: corepack enable

            - name: Cache Composer
              uses: actions/cache@v5
              with:
                  path: ~/.cache/composer/files
                  key: "${{ runner.os }}-install-composer-${{ hashFiles('plugin/composer.json') }}"
                  restore-keys: "${{ runner.os }}-install-composer-"

            # Everything below runs against this, and it is thrown away with the runner. It is not
            # the plugin's own test application: that one arrives pre-wired, which is exactly what
            # makes it unable to prove anything about installing.
            - name: Create a throwaway store
              run: composer create-project sylius/sylius-standard store --no-interaction --no-scripts

            # Copied into vendor/, not symlinked, because a copy is what Packagist gives a reader.
            # Composer symlinks a path repository by default; webpack resolves the link to its
            # target and walks up from *there* looking for node_modules, so the plugin's own import
            # of @nmipayments/nmi-pay went looking outside the store and `yarn build` failed. The
            # local rehearsal passed only because the plugin checkout carries a node_modules of its
            # own — precisely the pre-wired machine this job exists to get away from. Found by
            # running the job, not by reading it.
            - name: Point it at the plugin under test
              working-directory: store
              run: |
                  composer config repositories.plugin '{"type": "path", "url": "../plugin", "options": {"symlink": false}}'
                  composer config minimum-stability dev

            # The README does not say to do this, and should not: a reader is installing into a
            # store that already has a database. A runner has an empty PostgreSQL and nothing else,
            # so the job has to supply what a real store already had.
            - name: Give the store a database
              working-directory: store
              run: bin/console doctrine:database:create --if-not-exists

            # ── The README path ──────────────────────────────────────────────────────────────────

            # **The commands come out of the README.** A workflow carrying its own copy would prove
            # the plugin installs and say nothing about whether the documentation is right —
            # somebody changes a step, updates the workflow, forgets the README, and this stays
            # green. That is the failure this job exists to prevent.
            - name: Read the install commands out of the README
              if: matrix.path == 'readme'
              run: |
                  php plugin/bin/extract-readme-commands \
                      --readme=plugin/README.md \
                      --until="## Configuring a payment method" \
                      | tee commands.txt
                  test -s commands.txt

            # **The file edits are mirrored, not extracted, and that half is weaker.** The bundle
            # line is a fragment beside a `// ...`, and the import is one line at the end of a file
            # the store owns; there is no honest way to turn a fragment into a file. Change one of
            # those blocks in the README and this step must change with it. Nothing here can catch
            # that; only a reader can. The recipe path below is the other half of the answer: it
            # applies the same edits from a file the bot of symfony/recipes-contrib validates.
            - name: Apply the file edits the README shows
              if: matrix.path == 'readme'
              working-directory: store
              run: |
                  php ../plugin/bin/apply-readme-edits ../plugin/README.md .

            - name: Run the README's own commands, in the order it gives them
              if: matrix.path == 'readme'
              working-directory: store
              run: |
                  set -euo pipefail
                  # Each command gets /dev/null as its input. Without that, the first one that
                  # reads stdin — composer and bin/console both do — swallows the rest of the
                  # file, and the job passes having run two of six commands. Found by running
                  # this against a real store rather than by reading it.
                  while IFS= read -r command <&3; do
                      echo "::group::$command"
                      eval "$command" < /dev/null
                      echo '::endgroup::'
                  done 3< ../commands.txt

            # ── The recipe path ──────────────────────────────────────────────────────────────────

            # The recipe is compiled the way symfony/recipes-contrib compiles its own, with the
            # same tool, from a tree laid out the way that repository is — `recipe/` here already
            # is — and the same two lints its bot runs on a pull request run here first.
            - name: Check out the recipes checker
              if: matrix.path == 'recipe'
              uses: actions/checkout@v5
              with:
                  repository: symfony-tools/recipes-checker
                  path: recipes-checker

            - name: Compile the recipe into a Flex endpoint
              if: matrix.path == 'recipe'
              run: |
                  set -euo pipefail
                  (cd recipes-checker && composer install --no-interaction --no-progress --prefer-dist)
                  # The generator writes into the output directory but does not create it.
                  mkdir -p recipes-tree endpoint && cp -r plugin/recipe/jpmmartin recipes-tree/
                  cd recipes-tree
                  git init -q && git add -A && git -c user.email=ci@example.invalid -c user.name=ci commit -q -m 'recipe'
                  git ls-tree HEAD */*/* | php ../recipes-checker/run lint:manifests
                  find . -name '*.yaml' | php ../recipes-checker/run lint:yaml
                  git ls-tree HEAD */*/* | php ../recipes-checker/run generate:flex-endpoint jpmmartin/SyliusNmiPlugin main flex/main ../endpoint/
                  test -s ../endpoint/index.json
                  grep -q '"jpmmartin/sylius-nmi-plugin"' ../endpoint/index.json

            # Composer refuses a plain-http endpoint unless told otherwise; this store is thrown
            # away with the runner. The endpoint is served from the same step that uses it, so
            # the server's lifetime is not a question.
            - name: Require the package and let the recipe do the files
              if: matrix.path == 'recipe'
              working-directory: store
              run: |
                  set -euo pipefail
                  (php -S 127.0.0.1:8765 -t ../endpoint > ../endpoint.log 2>&1 &)
                  for i in $(seq 1 10); do curl -sf -o /dev/null http://127.0.0.1:8765/index.json && break; sleep 1; done
                  composer config secure-http false
                  composer config extra.symfony.endpoint --json '["http://127.0.0.1:8765/index.json", "flex://defaults"]'
                  composer require jpmmartin/sylius-nmi-plugin --no-interaction --no-progress 2>&1 | tee require.log
                  grep -q 'Configuring jpmmartin/sylius-nmi-plugin' require.log \
                      || { echo 'Flex did not apply the recipe.'; exit 1; }
                  grep -q 'Four things no recipe can do' require.log \
                      || { echo 'The post-install instructions were not printed.'; exit 1; }
                  composer recipes jpmmartin/sylius-nmi-plugin | grep -q 'up to date' \
                      || { echo 'The recipe is not recorded as installed in symfony.lock.'; exit 1; }
                  test -f config/packages/jpm_martin_sylius_nmi.yaml && test -f config/routes/jpm_martin_sylius_nmi.yaml \
                      || { echo 'The recipe did not copy its two files.'; exit 1; }
                  grep -q "import '@vendor/jpmmartin/sylius-nmi-plugin/assets/shop/entrypoint';" assets/shop/entrypoint.js \
                      || { echo 'The recipe did not add the import to assets/shop/entrypoint.js.'; exit 1; }
                  grep -q '###> jpmmartin/sylius-nmi-plugin ###' .gitignore \
                      || { echo 'The recipe did not add its .gitignore block.'; exit 1; }

            # What the recipe printed, done as printed. `cache:clear` and `assets:install` are not
            # here because Sylius Standard's own auto-scripts ran them with the require.
            - name: Do what the recipe said was left
              if: matrix.path == 'recipe'
              working-directory: store
              run: |
                  set -euo pipefail
                  yarn add @nmipayments/nmi-pay && yarn build
                  bin/console doctrine:migrations:migrate --no-interaction
                  echo 'SYLIUS_PAYMENT_ENCRYPTION_KEY_PATH=%kernel.project_dir%/config/encryption/payment.key' >> .env.local
                  bin/console sylius:payment:generate-key

            # ── The same store, either way ───────────────────────────────────────────────────────

            # Step 6's own failure, seen on a real store: the generator writes wherever the
            # environment points at the moment it runs, so generated before the path changed, the
            # key lands in the skeleton's file and the store fails on its first encryption.
            - name: The key was generated where the store points
              working-directory: store
              run: |
                  test -s config/encryption/payment.key \
                      || { echo 'No key at config/encryption/payment.key. Step 6 — the path in .env.local is set before the generator runs.'; exit 1; }

            # These three are what a half-finished install actually costs, and every one of them
            # fails silently: a missing bundle looks like a failed package, missing routes look
            # like a broken page, and unbuilt assets look like a broken template.
            - name: The bundle registered
              working-directory: store
              run: |
                  bin/console debug:container --tag=sylius.gateway_configuration_type \
                      | grep -q 'JpmMartin' \
                      || { echo 'The NMI gateway is not registered. Step 2 — register the bundle.'; exit 1; }

            - name: The routes were imported
              working-directory: store
              run: |
                  bin/console debug:router | grep -q 'jpm_martin_sylius_nmi_shop_complete_card_payment' \
                      || { echo 'The pay route is missing. Step 3 — import the routes.'; exit 1; }
                  bin/console debug:router | grep -q '/nmi/webhooks/' \
                      || { echo 'The webhook endpoint is missing. Step 3 — import the webhook routes.'; exit 1; }

            - name: The migrations created the plugin's tables
              working-directory: store
              run: |
                  # Counted exactly. `grep -q 4` would match a 4 anywhere in the table the console
                  # draws — including in 14, in 40, or in a column width — and pass while three of
                  # the four tables were missing.
                  tables=$(bin/console dbal:run-sql \
                      "SELECT count(*) AS n FROM information_schema.tables WHERE table_name LIKE 'jpm_martin%'" \
                      | grep -oE '[0-9]+' | tail -1)
                  test "$tables" = '4' \
                      || { echo "Expected 4 plugin tables, found ${tables:-none}. Step 4 — run the migration."; exit 1; }

            # The step that fails most silently of all: the pay page renders and simply has no card
            # fields, with nothing in the log and nothing in the console to say why. The plugin's
            # script travels inside the shop's own entry now, so that entry is what must carry it.
            - name: The shop build carries the plugin's script
              working-directory: store
              run: |
                  test -f public/build/app/shop/entrypoints.json \
                      || { echo 'The shop assets were never built. Step 5.'; exit 1; }
                  test -s public/build/app/shop/app-shop-entry.js \
                      || { echo 'app-shop-entry.js was not produced. Step 5.'; exit 1; }
                  grep -q 'data-nmi' public/build/app/shop/app-shop-entry.js \
                      || { echo "The shop build does not carry the plugin's script. Step 5 — the import line in assets/shop/entrypoint.js, or yarn build was never run after adding it."; exit 1; }

            # Everything above proves the parts exist. Nothing proves a page renders — and a wrong
            # template name or a broken build shows up on the homepage, loudly, here. The sample
            # data is what gives the store a channel to answer on.
            - name: Give the store something to show
              working-directory: store
              run: bin/console sylius:fixtures:load default --no-interaction

            - name: The shop entry reaches a real shop page
              working-directory: store
              run: |
                  cat > public/router.php <<'PHP'
                  <?php
                  // PHP's built-in server hands static files back itself and everything else to Symfony.
                  if (is_file(__DIR__ . parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH))) {
                      return false;
                  }
                  require __DIR__ . '/index.php';
                  PHP
                  # `variables_order=EGPCS`, because PHP's built-in server hands the environment to
                  # getenv() only — nothing lands in $_SERVER or $_ENV, which is where Symfony's
                  # Dotenv looks before falling back to the store's .env. Without the E, the job's
                  # DATABASE_URL is invisible to the served page, the .env's MySQL address wins,
                  # and the homepage answers 500 with a connection refused. The console never
                  # shows it: the CLI populates $_SERVER from the environment by itself. Found by
                  # the first run of this step in the runner, reproduced locally with a probe.
                  php -S 127.0.0.1:8000 -d variables_order=EGPCS -t public public/router.php > server.log 2>&1 &
                  for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8000/ && break; sleep 1; done
                  status=$(curl -s -o homepage.html -w '%{http_code}' http://localhost:8000/en_US/)
                  test "$status" = '200' \
                      || { echo "The shop's homepage answered $status."; grep -o '<title>[^<]*' homepage.html | head -1; tail -40 server.log; exit 1; }
                  grep -q 'app-shop-entry' homepage.html \
                      || { echo 'The homepage carries no app-shop-entry script tag, so nothing loads the shop build the plugin lives in.'; exit 1; }

            # ── The recipe path, undone ──────────────────────────────────────────────────────────

            # Flex unconfigures what it configured. A store that tries the plugin and takes it out
            # again must be left as it was found.
            - name: Removing the package removes what the recipe added
              if: matrix.path == 'recipe'
              working-directory: store
              run: |
                  set -euo pipefail
                  composer remove jpmmartin/sylius-nmi-plugin --no-interaction --no-progress
                  ! grep -q 'JpmMartinSyliusNmiPlugin' config/bundles.php \
                      || { echo 'The bundle line survived composer remove.'; exit 1; }
                  test ! -e config/packages/jpm_martin_sylius_nmi.yaml && test ! -e config/routes/jpm_martin_sylius_nmi.yaml \
                      || { echo 'A copied file survived composer remove.'; exit 1; }
                  ! grep -q 'sylius-nmi-plugin' assets/shop/entrypoint.js \
                      || { echo 'The import survived composer remove.'; exit 1; }
                  ! grep -q '###> jpmmartin/sylius-nmi-plugin' .gitignore \
                      || { echo 'The .gitignore block survived composer remove.'; exit 1; }
