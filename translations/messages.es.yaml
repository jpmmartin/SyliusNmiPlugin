    gateway_factory:
        nmi: NMI
    ui:
        saved_cards: Tarjetas guardadas
        no_saved_cards: Todavía no tienes ninguna tarjeta guardada.
        expires: Caduca
        expired: Caducada
        default_card: Predeterminada
        make_default: Hacer predeterminada
        add_card: Añadir una tarjeta
    admin:
        void: Anular
        refund_plugin_notice: >-
            El plugin de reembolsos está instalado pero no ofrecerá esta pasarela, porque su lista
            de pasarelas admitidas no la nombra. Reembolsar desde la pantalla del pedido funciona
            igualmente; solo las pantallas del plugin de reembolsos necesitan esta entrada.
        gateway_notice:
            menu: Avisos de la pasarela
            heading: Lo que informó NMI
            occurred_at: Recibido
            type: Tipo
            reference: Referencia
            payment_method: Método de pago
            reason: Motivo
            types:
                settlement_failure: Liquidación fallida
                chargeback: Contracargo
    form:
        gateway_config:
            tokenization_key: Clave de tokenización
            tokenization_key_help: La clave pública con el permiso Tokenization. El navegador la usa para tokenizar los datos de la tarjeta, así que es visible para los compradores.
            security_key: Clave de seguridad
            security_key_help: La clave privada de la API. La tienda la usa para cobrar, capturar, anular y reembolsar; se guarda cifrada y nunca se envía al navegador.
            environment: Entorno
            environment_help: Sandbox envía las transacciones a la pasarela de pruebas de NMI; Producción las envía a la pasarela real.
            environments:
                placeholder: Elige un entorno
                production: Producción
                sandbox: Sandbox
            use_authorize: Autorizar primero, capturar después
            use_authorize_help: Si se activa, el checkout sólo autoriza la tarjeta. El importe se captura cuando el pedido se envía o a mano desde la página del pedido.
            store_cards: Permitir que los compradores guarden su tarjeta
            store_cards_help: >-
                Si se activa, un comprador identificado puede dejar una tarjeta guardada en NMI y
                pagar con ella la próxima vez. A nadie se le guarda nada si no lo pide, a los
                invitados no se les ofrece nunca, y la tienda no llega a tener el número de la
                tarjeta: sólo la referencia que devuelve NMI. Si se deja desactivada, nada cambia
                en esta pasarela.
            authenticate_stored_cards: Autenticar las tarjetas guardadas con 3-D Secure
            authenticate_stored_cards_help: >-
                Si se deja activada, quien vuelva se autenticará otra vez antes de cada pago.
                Si se desactiva, pagar con una tarjeta guardada es un solo clic.
                <strong>Para titulares de la UE y el Reino Unido esa elección tiene consecuencias:</strong>
                el emisor puede rechazar un pago que no lleve autenticación, y la responsabilidad
                por un contracargo se queda en la tienda en vez de pasar al emisor. Vendiendo a
                Norteamérica esa presión no aplica igual, y el pago de un solo clic es lo habitual.
            webhook_signing_key: Clave de firma de webhooks
            webhook_signing_key_help: >-
                La muestra la página de Webhooks de NMI. Pégala aquí y la tienda aceptará los
                eventos que envíe esa cuenta: reembolsos y anulaciones hechos en el portal de NMI,
                liquidaciones, contracargos y actualizaciones de tarjetas. Déjala en blanco y no
                se acepta ningún evento. Se guarda cifrada y nunca se envía al navegador.
    shop:
        pay:
            heading: Pagar con tarjeta
            amount: Importe a pagar:
            card_unreadable: No se han podido leer los datos de la tarjeta. Revísalos e inténtalo de nuevo.
            not_authenticated: No se ha podido autenticar la tarjeta, así que no se ha cobrado nada. Inténtalo de nuevo o usa otra tarjeta.
            save_card: Guardar esta tarjeta para la próxima vez
            use_saved_card: Pagar con una tarjeta guardada
            new_card: Usar una tarjeta nueva
            pay_now: Pagar
