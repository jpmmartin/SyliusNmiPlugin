jpm_martin_sylius_nmi:
    gateway_factory:
        nmi: NMI
    ui:
        saved_cards: Saved cards
        no_saved_cards: You have no saved cards yet.
        expires: Expires
        expired: Expired
        default_card: Default
    admin:
        void: Void
        refund_plugin_notice: >-
            The refund plugin is installed but will not offer this gateway, because its list of
            supported gateways does not name it. Refunding from the order screen works either
            way; only the refund plugin's own screens need this entry.
    form:
        gateway_config:
            tokenization_key: Tokenization key
            tokenization_key_help: The public key with the Tokenization permission. The browser uses it to tokenize card details, so it is visible to shoppers.
            security_key: Security key
            security_key_help: The private API key. The store uses it to charge, capture, void and refund; it is stored encrypted and never sent to the browser.
            environment: Environment
            environment_help: Sandbox sends transactions to NMI's sandbox gateway; Production sends them to the live gateway.
            environments:
                placeholder: Choose an environment
                production: Production
                sandbox: Sandbox
            use_authorize: Authorize first, capture later
            use_authorize_help: When enabled, checkout only authorizes the card. The amount is captured when the order ships or by hand from the order page.
            store_cards: Let shoppers save their card
            store_cards_help: >-
                When enabled, a signed-in shopper may keep a card on file with NMI and pay with it
                next time. Nobody saves anything unless they ask to, guests are never offered it,
                and the store never holds a card number — only the reference NMI gives back. Leave
                it off and nothing about this gateway changes.
    shop:
        pay:
            heading: Pay by card
            amount: Amount to pay:
            card_unreadable: The card details could not be read. Please check them and try again.
            not_authenticated: The card could not be authenticated, so it has not been charged. Try again or use another card.
            save_card: Save this card for next time
