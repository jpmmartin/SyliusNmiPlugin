    email:
        stored_card_attention:
            subject:
                closed: A saved card can no longer be used
                needs_attention: Please check a saved card
            greeting: Hello,
            body:
                closed: >-
                    Your bank has closed the %brand% card ending %last_four% that you had saved with
                    us, so it can no longer be used. Nothing has been charged to it and there is
                    nothing you need to do right now — next time you order, you can add another
                    card.
                needs_attention: >-
                    Your bank has asked us to check with you about the %brand% card ending
                    %last_four% that you had saved with us. It still works for now, so there is
                    nothing you have to do today; your bank can tell you more.
            reassurance: >-
                We never store your card number. Only your bank and our payment provider hold it,
                and we can see nothing more than the last four digits.
    form:
        gateway_config:
            tokenization_key: Tokenization key
            tokenization_key_help: The public key with the Tokenization permission. The browser uses it to tokenize card details, so it is visible to shoppers.
            security_key: Security key
            security_key_help: The private API key. The store uses it to charge, capture, void and refund; it is stored encrypted and never sent to the browser.
            api_base_url: Gateway host
            api_base_url_help: The address of the gateway that serves this account — https, and nothing after the host. NMI's own accounts use https://secure.nmi.com for live and https://sandbox.nmi.com for a sandbox account. An account opened through a reseller uses the reseller's host, which is the address you log into the merchant portal with. Only the store's own calls go here; card details are always tokenised against NMI's hosts.
            use_authorize: Authorize first, capture later
            use_authorize_help: When enabled, checkout only authorizes the card. The amount is captured when the order ships or by hand from the order page.
            store_cards: Let shoppers save their card
            store_cards_help: >-
                When enabled, a signed-in shopper may keep a card on file with NMI and pay with it
                next time. Nobody saves anything unless they ask to, guests are never offered it,
                and the store never holds a card number — only the reference NMI gives back. Leave
                it off and nothing about this gateway changes.
            authenticate_stored_cards: Authenticate saved cards with 3-D Secure
            authenticate_stored_cards_help: >-
                Leave this on and a returning shopper authenticates again before each payment.
                Turn it off and paying with a saved card is one click.
                <strong>For cardholders in the EU and the UK that choice has consequences:</strong>
                the issuer may decline a payment that carries no authentication, and liability for
                a chargeback stays with you rather than moving to the issuer. Selling into North
                America that pressure does not apply the same way, and the one-click payment is the
                more common trade.
            email_cardholder: Email the shopper when a saved card is closed or flagged
            email_cardholder_help: >-
                When enabled, a shopper is emailed if their bank closes a card they saved with
                you, or asks that they be contacted about it. Leave it off and the card is still
                marked and still stops being offered — only the email is skipped.
            notify_unknown_transactions: List transactions this store does not recognise
            notify_unknown_transactions_help: >-
                Only useful when this NMI account belongs to this store alone. If you share the
                account with another shop or another system, every one of their transactions
                arrives here too and this would list all of them. The events are accepted and
                logged either way.
            webhook_signing_key: Webhook signing key
            webhook_signing_key_help: >-
                NMI's Webhooks settings page shows this. Paste it here and the store will accept
                the events that account sends — refunds and voids performed in NMI's own portal,
                settlement, chargebacks and card updates. Leave it blank and no event is accepted.
                It is stored encrypted and never sent to the browser. Your developer must also import the plugin's webhook route, or nothing reaches the store at all.
    shop:
        pay:
            heading: Pay by card
            amount: Amount to pay:
            card_number: Card number
            card_number_placeholder: 1234 1234 1234 1234
            expiry: Expiry date
            expiry_placeholder: MM / YY
            security_code: Security code
            security_code_placeholder: CVC
            card_unreadable: The card details could not be read. Please check them and try again.
            form_unavailable: The card form could not be loaded. Please reload the page.
            not_authenticated: The card could not be authenticated, so it has not been charged. Try again or use another card.
            save_card: Save this card for next time
            use_saved_card: Pay with a saved card
            new_card: Use a new card
            pay_now: Pay
