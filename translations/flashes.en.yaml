jpm_martin_sylius_nmi:
    payment:
        declined: Your card was declined.
        failed: The payment could not be completed. Please try again or use another card.
        unreachable: The payment gateway could not be reached. Nothing has been charged; please try again.
        card_already_saved: You already have this card saved, so it has not been added again.
        capture_refused: The gateway refused the capture, so the payment has not been completed.
        no_authorisation: This payment has no recorded authorisation to capture.
        void_refused: The gateway refused the void, so the payment has not been cancelled.
        refund_refused: The gateway refused to give the money back, so the payment has not been refunded.
        already_refunded: This payment has already been refunded.
        nothing_to_refund: This payment has no recorded transaction to give back.
    stored_card:
        default_changed: That card is now your default.
        deleted: The card has been removed.
        not_forgotten: The gateway refused to forget the card, so nothing has been deleted.
        gateway_unreachable: The gateway could not be reached, so the card has not been deleted. Please try again.
        not_configured: This payment method is not configured, so the card cannot be forgotten at the gateway.
        added: The card has been saved.
        rejected: The gateway would not accept that card.
        no_token: No card details were received. Please try again.
        not_described: The card was saved at the gateway but could not be filed here. Please contact the shop.
