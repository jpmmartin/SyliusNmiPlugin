imports:
    - { resource: "@JpmMartinSyliusNmiPlugin/config/config.yaml" }
    - { resource: "services_test.php" }

jpm_martin_sylius_nmi:
    # Empty in the committed .env; a reseller host goes in the gitignored .env.local / .env.test.local.
    api_base_url: '%env(NMI_API_BASE_URL)%'

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

# Remove if you do not need to extend entities
doctrine:
    orm:
        entity_managers:
            default:
                mappings:
                    TestApplication:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/../../../tests/TestApplication/src/Entity'
                        prefix: Tests\JpmMartin\SyliusNmiPlugin
