# The admin routes go under the admin path, which is what puts them behind the admin firewall —
# its pattern is that path. Importing them without the prefix leaves the void action reachable by
# anyone. The README tells a consuming store the same thing.
jpm_martin_sylius_nmi_admin:
    resource: "@JpmMartinSyliusNmiPlugin/config/routes/admin.yaml"
    prefix: /%sylius_admin.path_name%

jpm_martin_sylius_nmi_shop:
    resource: "@JpmMartinSyliusNmiPlugin/config/routes/shop.yaml"

jpm_martin_sylius_nmi_refund_plugin:
    resource: refund_plugin_routes.php
    type: php

# Under the locale *and* /account: Sylius's access_control rule is
# `^/(?!admin|api…)[^/]++/account`, so that first segment is the locale. Mounted without it these
# pages would sit inside the shop firewall but outside the rule that requires ROLE_USER.
jpm_martin_sylius_nmi_shop_account:
    resource: "@JpmMartinSyliusNmiPlugin/config/routes/shop_account.yaml"
    prefix: /{_locale}/account
    requirements:
        _locale: ^[A-Za-z]{2,4}(_([A-Za-z]{4}|[0-9]{3}))?(_([A-Za-z]{2}|[0-9]{3}))?$
