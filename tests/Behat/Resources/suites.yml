# This plugin's own Behat suites. Sylius's suites are imported alongside these by
# behat.yml.dist, so every `sylius.behat.context.*` service below is one Sylius ships.

default:
    suites:
        # Skeleton demo, retained until the plugin's own wiring replaces it as the reference.
        greeting_customer:
            contexts:
                # The shop layout cannot render without a channel, and Sylius's own suites
                # purge the database before every scenario, so this suite creates its own.
                - sylius.behat.context.hook.doctrine_orm
                - sylius.behat.context.setup.channel

                - jpm_martin_sylius_nmi.context.ui.shop.welcome

            filters:
                tags: "@greeting_customer"
