# This plugin's own Behat suites. Sylius's suites are imported alongside these by
# behat.yml.dist, so every `sylius.behat.context.*` service below is one Sylius ships.
#
# The two NMI suites mirror Sylius's own `ui_managing_payment_methods` and
# `ui_paying_for_order` suites; the plugin's contexts are added to them as they appear.

default:
    suites:
        # Admin UI: configuring an NMI payment method.
        ui_managing_nmi_payment_methods:
            contexts:
                - sylius.behat.context.hook.bad_gateway
                - sylius.behat.context.hook.doctrine_orm
                - sylius.behat.context.hook.session

                - sylius.behat.context.transform.address
                - sylius.behat.context.transform.customer
                - sylius.behat.context.transform.locale
                - sylius.behat.context.transform.payment
                - sylius.behat.context.transform.product
                - sylius.behat.context.transform.shared_storage
                - sylius.behat.context.transform.shipping_method

                - sylius.behat.context.setup.admin_security
                - sylius.behat.context.setup.channel
                - sylius.behat.context.setup.currency
                - sylius.behat.context.setup.locale
                - sylius.behat.context.setup.order
                - sylius.behat.context.setup.payment
                - sylius.behat.context.setup.product
                - sylius.behat.context.setup.shipping
                - sylius.behat.context.setup.user
                - sylius.behat.context.setup.zone

                - sylius.behat.context.ui.admin.managing_payment_methods
                - sylius.behat.context.ui.admin.notification
                - sylius.behat.context.ui.admin.search_filter
                - sylius.behat.context.ui.save
                - sylius.behat.context.ui.shop.locale

                - jpm_martin_sylius_nmi.context.ui.admin.managing_nmi_payment_methods

            filters:
                tags: "@managing_nmi_payment_methods&&@ui"

        # Shop UI: paying for an order with an NMI payment method.
        ui_paying_with_nmi:
            contexts:
                - sylius.behat.context.hook.bad_gateway
                - sylius.behat.context.hook.doctrine_orm
                - sylius.behat.context.hook.guest_cart
                - sylius.behat.context.hook.session

                - sylius.behat.context.transform.address
                - sylius.behat.context.transform.channel
                - sylius.behat.context.transform.country
                - sylius.behat.context.transform.customer
                - sylius.behat.context.transform.lexical
                - sylius.behat.context.transform.locale
                - sylius.behat.context.transform.order
                - sylius.behat.context.transform.payment
                - sylius.behat.context.transform.product
                - sylius.behat.context.transform.product_variant
                - sylius.behat.context.transform.shared_storage
                - sylius.behat.context.transform.shipping_method
                - sylius.behat.context.transform.tax_category
                - sylius.behat.context.transform.tax_rate
                - sylius.behat.context.transform.user
                - sylius.behat.context.transform.zone

                - sylius.behat.context.setup.admin_user
                - sylius.behat.context.setup.cart
                - sylius.behat.context.setup.channel
                - sylius.behat.context.setup.checkout
                - sylius.behat.context.setup.checkout.address
                - sylius.behat.context.setup.currency
                - sylius.behat.context.setup.geographical
                - sylius.behat.context.setup.locale
                - sylius.behat.context.setup.order
                - sylius.behat.context.setup.payment
                - sylius.behat.context.setup.payment_request
                - sylius.behat.context.setup.product
                - sylius.behat.context.setup.shipping
                - sylius.behat.context.setup.shop_security
                - sylius.behat.context.setup.taxation
                - sylius.behat.context.setup.user
                - sylius.behat.context.setup.zone

                - sylius.behat.context.ui.admin.managing_payment_requests
                - sylius.behat.context.ui.save
                - sylius.behat.context.ui.shop.account
                - sylius.behat.context.ui.shop.cart
                - sylius.behat.context.ui.shop.checkout
                - sylius.behat.context.ui.shop.checkout.addressing
                - sylius.behat.context.ui.shop.checkout.complete
                - sylius.behat.context.ui.shop.checkout.order_details
                - sylius.behat.context.ui.shop.checkout.payment
                - sylius.behat.context.ui.shop.checkout.shipping
                - sylius.behat.context.ui.shop.checkout.thank_you
                - sylius.behat.context.ui.shop.payment_request

            filters:
                tags: "@paying_with_nmi&&@ui"

        # Shop UI: the saved-cards page in the shopper's account.
        #
        # No scenario here puts a card on file, and that is a limitation rather than a choice: the
        # two flows that do — saving while paying, and adding one from the account — mint a token
        # inside the gateway's own frames, which needs a browser and live credentials. CI runs
        # Behat with `~@javascript`, so those belong to the sandbox walkthrough instead.
        ui_managing_nmi_stored_cards:
            contexts:
                - sylius.behat.context.hook.doctrine_orm
                - sylius.behat.context.hook.session

                - sylius.behat.context.transform.channel
                - sylius.behat.context.transform.customer
                - sylius.behat.context.transform.lexical
                - sylius.behat.context.transform.locale
                - sylius.behat.context.transform.shared_storage
                - sylius.behat.context.transform.user

                - sylius.behat.context.setup.channel
                - sylius.behat.context.setup.currency
                - sylius.behat.context.setup.customer
                - sylius.behat.context.setup.geographical
                - sylius.behat.context.setup.locale
                - sylius.behat.context.setup.shop_security
                - sylius.behat.context.setup.user
                - jpm_martin_sylius_nmi.context.setup.stored_card

                - sylius.behat.context.ui.shop.account
                - jpm_martin_sylius_nmi.context.ui.shop.managing_nmi_stored_cards

            filters:
                tags: "@managing_nmi_stored_cards&&@ui"
